name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Served stylesheet matches src/main.css
        # sync-css.mjs has described --check as "(CI guard)" since it was written, and no CI
        # job ran it. `prebuild` regenerates the file, so a stale commit self-heals during the
        # build and the drift never surfaces — which is how the served copy once went 11 weeks
        # behind. It matters more now that the filename is content-hashed: the committed CSS,
        # its hash and src/generated/cssHref.ts have to agree, and this is what says so.
        run: npm run check:css
      - name: Deploy config
        # vercel.json and next.config.ts together are how this site is served — the cache
        # policy, five security headers, and the CSP. Nothing referenced either as a check, so
        # both could be deleted with every other gate still green. Static and instant, so it
        # runs before the build.
        run: npm run check:deploy
      - name: Lint
        # eslint runs nowhere. Not here, and not during `next build` either: Next 16 dropped
        # the build-time ESLint integration, so the `lint` script has been sitting in
        # package.json with nothing invoking it. It exits 0 today (18 warnings, 0 errors), so
        # this adds error-level cover -- react-hooks and Next correctness rules -- rather than
        # enforcing the warnings, which are deliberate <img> choices on this site.
        run: npm run lint
      - name: Responsive image variants are present
        # generate-image-variants.mjs --check is a real guard with a real failure mode, wired
        # into package.json and reached by nothing. Its own message says what a miss costs:
        # bts.html serving full-size originals into an ~894px box. All 69 sources pass today
        # and every variant is committed, so this is cover, not a new chore.
        run: npm run check:images
      - name: Build
        run: npm run build
